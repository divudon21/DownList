name: Build APKs & Create Release

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel (main branch only)'
        type: choice
        options: [stable, beta]
        default: stable

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Signed APKs & Publish Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Bootstrap Android Gradle wrapper & SDK-matched config
        run: |
          set -euo pipefail
          mkdir -p /tmp/custom_android
          cp android/app/src/main/AndroidManifest.xml /tmp/custom_android/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/dowlist/com/*.kt /tmp/custom_android/
          cp android/app/src/main/res/drawable/ic_launcher_monochrome.xml /tmp/custom_android/ic_launcher_monochrome.xml
          cp -r android/app/src/main/res/mipmap-* /tmp/custom_android/

          rm -rf android
          python3 scripts/run_with_annotations.py \
            flutter create --platforms=android --org com.example --project-name ai_agent_downloader .

          cp /tmp/custom_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/dowlist/com
          cp /tmp/custom_android/*.kt android/app/src/main/kotlin/com/dowlist/com/
          sed -i 's/com.example.ai_agent_downloader/com.dowlist.com/g' android/app/build.gradle.kts
          echo 'force-version-code-ignoring-abi=true' >> android/gradle.properties
          mkdir -p android/app/src/main/res/drawable
          cp /tmp/custom_android/ic_launcher_monochrome.xml android/app/src/main/res/drawable/ic_launcher_monochrome.xml
          rm -rf android/app/src/main/res/mipmap-*
          cp -r /tmp/custom_android/mipmap-* android/app/src/main/res/
          chmod +x android/gradlew

      - name: Configure release signing
        env:
          RELEASE_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEY_BASE64" ]; then
            test -n "$RELEASE_STORE_PASSWORD" && test -n "$RELEASE_KEY_ALIAS" && test -n "$RELEASE_KEY_PASSWORD"
            printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > android/app/upload-key.jks
            SIGNING_MODE=stable
          else
            if [ -n "$RELEASE_STORE_PASSWORD$RELEASE_KEY_ALIAS$RELEASE_KEY_PASSWORD" ]; then
              echo '::error::Incomplete signing secrets.'; exit 1
            fi
            RELEASE_STORE_PASSWORD=android
            RELEASE_KEY_ALIAS=upload-key
            RELEASE_KEY_PASSWORD=android
            keytool -genkeypair -keystore android/app/upload-key.jks -alias upload-key \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DownList,O=DownList,C=IN" \
              -storepass "$RELEASE_STORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" >/dev/null 2>&1
            SIGNING_MODE=temporary
            echo '::warning::No persistent signing key configured; this build cannot update a differently signed installation.'
          fi
          chmod 600 android/app/upload-key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-key.jks\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_PASSWORD" "$RELEASE_KEY_ALIAS" > android/key.properties
          chmod 600 android/key.properties
          echo "SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"
          python3 scripts/configure_android_signing.py

      - name: Install Dart/Flutter dependencies
        run: python3 scripts/run_with_annotations.py flutter pub get

      - name: Static analysis check
        run: python3 scripts/run_with_annotations.py flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: python3 scripts/run_with_annotations.py flutter test

      - name: Build split-per-ABI release APKs
        run: python3 scripts/run_with_annotations.py flutter build apk --release --split-per-abi --build-number="$GITHUB_RUN_NUMBER"

      - name: Build universal release APK
        run: python3 scripts/run_with_annotations.py flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"

      - name: Package & verify release APKs
        run: |
          set -euo pipefail
          set -E
          trap 'echo "::error::Verification failed at line $LINENO: $BASH_COMMAND"' ERR
          mkdir -p release-apks
          ls -lh build/app/outputs/flutter-apk/

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/DownList-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/DownList-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/DownList-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/DownList-universal.apk

          for apk in release-apks/*.apk; do
            size=$(stat -c%s "$apk")
            echo "Verified $apk (${size} bytes)"
            if [ "$size" -lt 1000000 ]; then
              echo "::error title=InvalidAPK::$apk is unexpectedly small (${size} bytes)"
              exit 1
            fi
          done

          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          TOOLS=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$TOOLS"
          echo "::notice::Using Android build tools at $TOOLS"
          AAPT="$(dirname "$TOOLS")/aapt"
          test -x "$AAPT"
          CERT_INFO=$("$TOOLS" verify --print-certs release-apks/DownList-universal.apk)
          echo "::notice::Certificate info $(echo "$CERT_INFO" | tr '\n' ';')"
          SIGNER=$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*certificate SHA-256 digest: *//p' | sed -n '1p')
          echo "::notice::Signing fingerprint length: ${#SIGNER}"
          test "${#SIGNER}" -eq 64
          for apk in release-apks/*.apk; do
            BADGING=$("$AAPT" dump badging "$apk" | sed -n '1p')
            echo "::notice::$BADGING"
            [[ "$BADGING" == *"name='com.dowlist.com'"* ]]
            [[ "$BADGING" == *"versionCode='$GITHUB_RUN_NUMBER'"* ]]
            ACTUAL=$("$TOOLS" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: *//p' | sed -n '1p')
            test "$SIGNER" = "$ACTUAL"
          done
          VERSION_NAME=$("$AAPT" dump badging release-apks/DownList-universal.apk | sed -n '1p' | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          test -n "$VERSION_NAME"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_SIGNER_SHA256=$SIGNER" >> "$GITHUB_ENV"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: DownList-APKs
          path: release-apks/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/203aad4c-ok-ai'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}
        run: |
          set -euo pipefail
          RELEASE_TARGET="${GITHUB_SHA}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            git fetch origin main
            RELEASE_TARGET=$(git rev-parse FETCH_HEAD)
            if ! git diff --quiet "$RELEASE_TARGET" HEAD -- . ':(exclude).github/workflows/android-apk.yml'; then
              echo '::error::Branch app content differs from merged main; refusing to release.'
              exit 1
            fi
          fi
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          TITLE="DownList ${APP_VERSION_NAME} (build ${GITHUB_RUN_NUMBER})"
          METADATA=$(python3 -c 'import json,os; print(json.dumps({"packageName":"com.dowlist.com","versionName":os.environ["APP_VERSION_NAME"],"versionCode":int(os.environ["GITHUB_RUN_NUMBER"]),"signerSha256":os.environ["APP_SIGNER_SHA256"]},separators=(",",":")))')
          SIGNING_NOTE="Signed with the configured release key."
          if [ "$SIGNING_MODE" = temporary ]; then
            SIGNING_NOTE="This build uses a temporary signing key; updating an installation signed with another key requires reinstalling and removes local app settings."
          fi

          cat <<EOF > /tmp/release_notes.md
          ## DownList — Android Release (${TAG})

          <!-- downlist-update:${METADATA} -->

          ${SIGNING_NOTE}

          Signed release APKs built from the app content of commit \`${RELEASE_TARGET}\`.

          ### Which APK should I install?
          - **\`DownList-arm64-v8a.apk\`** *(Recommended)* — Modern 64-bit Android phones & tablets.
          - **\`DownList-armeabi-v7a.apk\`** — Older 32-bit ARM Android devices.
          - **\`DownList-universal.apk\`** — Universal APK supporting all CPU architectures.
          - **\`DownList-x86_64.apk\`** — Android emulators / Chromebooks (x86_64).

          ### SHA-256 Checksums
          \`\`\`
          $(cat release-apks/SHA256SUMS.txt)
          \`\`\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace signed artifacts."
            exit 1
          fi
          PRERELEASE=()
          if [ "$RELEASE_CHANNEL" = beta ]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" \
            release-apks/*.apk release-apks/SHA256SUMS.txt \
            --target "${RELEASE_TARGET}" \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md "${PRERELEASE[@]}"
